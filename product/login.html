<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 / 注册 · 智途</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 120px 24px 60px;
      background: radial-gradient(120% 90% at 50% 0%, #2A1E6B 0%, #0E0B1A 70%)
    }

    .login-card {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 24px 60px rgba(20, 10, 60, .28)
    }

    .login-card h1 {
      font-size: 26px;
      color: var(--ink);
      letter-spacing: -.02em;
      margin-bottom: 6px
    }

    .login-card .sub {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px
    }

    .login-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      background: var(--paper);
      padding: 5px;
      border-radius: 12px
    }

    .login-tab {
      flex: 1;
      padding: 10px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      transition: all .2s
    }

    .login-tab.active {
      background: #fff;
      color: var(--purple);
      box-shadow: 0 2px 8px rgba(20, 10, 60, .08)
    }

    .lfield {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px
    }

    .lfield label {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink)
    }

    .lfield input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s
    }

    .lfield input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(87, 62, 255, .12)
    }

    .code-row {
      display: flex;
      gap: 10px
    }

    .code-row input {
      flex: 1
    }

    .code-btn {
      flex: 0 0 auto;
      padding: 0 18px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      font-size: 14px;
      font-weight: 600;
      color: var(--purple);
      white-space: nowrap
    }

    .code-btn:disabled {
      color: #999;
      border-color: var(--line);
      cursor: not-allowed
    }

    .login-error {
      color: #D14343;
      font-size: 13px;
      margin-bottom: 12px;
      display: none
    }

    .login-error.show {
      display: block
    }

    .login-submit {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      margin-top: 4px
    }

    .login-hint {
      margin-top: 18px;
      font-size: 12px;
      color: #999;
      text-align: center;
      line-height: 1.5
    }

    .login-back {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: var(--muted)
    }

    .login-back:hover {
      color: var(--purple)
    }
  </style>
</head>

<body>

  <div class="login-wrap">
    <div class="login-card">
      <h1 id="loginTitle">登录智途</h1>
      <p class="sub" id="loginSub">用手机号快速登录，继续你的升学规划。</p>

      <div class="login-tabs">
        <button class="login-tab active" data-mode="login" id="tabLogin">登录</button>
        <button class="login-tab" data-mode="register" id="tabRegister">注册</button>
      </div>

      <form id="loginForm" novalidate>
        <div class="lfield">
          <label for="phone">手机号</label>
          <input id="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入 11 位手机号" autocomplete="tel">
        </div>
        <div class="lfield">
          <label for="code">验证码</label>
          <div class="code-row">
            <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码"
              autocomplete="one-time-code">
            <button type="button" class="code-btn" id="codeBtn">获取验证码</button>
          </div>
        </div>
        <div class="login-error" id="loginError"></div>
        <button type="submit" class="btn btn-primary login-submit" id="submitBtn">登录</button>
      </form>

      <p class="login-hint">演示环境：验证码可随意填写 6 位数字。登录状态仅保存在本设备浏览器。</p>
      <a href="index.html" class="login-back">← 返回首页</a>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    (function () {
      "use strict";

      const params = new URLSearchParams(location.search);
      const redirect = params.get('redirect') || 'index.html';

      const form = document.getElementById('loginForm');
      const phoneEl = document.getElementById('phone');
      const codeEl = document.getElementById('code');
      const codeBtn = document.getElementById('codeBtn');
      const errEl = document.getElementById('loginError');
      const submitBtn = document.getElementById('submitBtn');
      const title = document.getElementById('loginTitle');
      const sub = document.getElementById('loginSub');
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');

      let mode = 'login';
      let countdown = 0;
      let timer = null;

      function setMode(m) {
        mode = m;
        tabLogin.classList.toggle('active', m === 'login');
        tabRegister.classList.toggle('active', m === 'register');
        title.textContent = m === 'login' ? '登录智途' : '注册新账号';
        sub.textContent = m === 'login' ? '用手机号快速登录，继续你的升学规划。' : '注册后即可保存测评记录，跨设备查看。';
        submitBtn.textContent = m === 'login' ? '登录' : '注册并登录';
        clearError();
      }

      function showError(msg) {
        errEl.textContent = msg;
        errEl.classList.add('show');
      }
      function clearError() { errEl.classList.remove('show'); }

      tabLogin.addEventListener('click', () => setMode('login'));
      tabRegister.addEventListener('click', () => setMode('register'));

      // 获取验证码（模拟倒计时）
      codeBtn.addEventListener('click', () => {
        const phone = phoneEl.value.trim();
        if (!/^1\d{10}$/.test(phone)) {
          showError('请输入正确的 11 位手机号');
          return;
        }
        clearError();
        countdown = 60;
        codeBtn.disabled = true;
        codeBtn.textContent = countdown + 's 后重发';
        timer = setInterval(() => {
          countdown--;
          if (countdown <= 0) {
            clearInterval(timer);
            codeBtn.disabled = false;
            codeBtn.textContent = '重新获取';
          } else {
            codeBtn.textContent = countdown + 's 后重发';
          }
        }, 1000);
        // 演示：直接把"验证码"提示出来
        if (window.showToast) window.showToast('演示验证码：123456');
      });

      form.addEventListener('submit', e => {
        e.preventDefault();
        const phone = phoneEl.value.trim();
        const code = codeEl.value.trim();
        if (!/^1\d{10}$/.test(phone)) { showError('请输入正确的 11 位手机号'); return; }
        if (!/^\d{6}$/.test(code)) { showError('请输入 6 位数字验证码'); return; }
        clearError();

        // 写入本地登录态（模拟）
        const user = {
          phone,
          nickname: '用户' + phone.slice(-4),
          avatar: '',
          ts: Date.now()
        };
        localStorage.setItem('zhitu_user', JSON.stringify(user));

        submitBtn.textContent = '处理中…';
        submitBtn.disabled = true;
        setTimeout(() => {
          window.location.href = redirect;
        }, 500);
      });

      // 已登录则直接跳回
      try {
        const existing = JSON.parse(localStorage.getItem('zhitu_user') || 'null');
        if (existing && existing.phone) {
          window.location.href = redirect;
        }
      } catch (e) { }
    })();
  </script>
</body>

</html>
